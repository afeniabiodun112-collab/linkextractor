<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Pipeline — Links & Emails</title>
    <style>
        :root {
            --bg: #0f0f12;
            --panel-bg: #1a1a1f;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --border: #2d2d35;
            --success: #10b981;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top section — Control Bar */
        .control-bar {
            padding: 1.5rem;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        #baseUrl { flex: 1; }
        #issueNum { width: 80px; }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-secondary { background: #334155; color: white; }
        .btn-secondary:hover:not(:disabled) { background: #475569; }
        .btn-danger { background: #991b1b; color: white; }
        .btn-danger:hover { background: #b91c1c; }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-bar {
            font-size: 0.85rem;
            color: var(--text-dim);
            padding: 0.25rem 0;
        }

        /* Main section — Split screen */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
            border-top: 1px solid var(--border);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid var(--border);
        }

        .panel:last-child { border-right: none; }

        .panel-header {
            padding: 1rem 1.5rem;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text);
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .count-badge {
            background: var(--bg);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }

        .row {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .row:hover { background: rgba(255,255,255,0.02); }

        .row-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            overflow: hidden;
        }

        .row-text {
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-sub {
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .copy-btn {
            padding: 0.3rem 0.6rem;
            font-size: 0.7rem;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        .copy-btn:hover { border-color: var(--accent); color: var(--text); }

        /* Emails specific styles */
        .email-breakdown {
            margin-top: 0.5rem;
            padding-left: 1rem;
            border-left: 1px solid var(--accent);
        }

        .breakdown-item {
            font-size: 0.75rem;
            padding: 0.25rem 0;
            color: var(--text-dim);
        }

        details summary {
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--accent);
            list-style: none;
        }

        details summary::-webkit-details-marker { display: none; }

        /* Animations */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .running { animation: pulse 1.5s infinite ease-in-out; }
    </style>
</head>
<body>

    <header class="control-bar">
        <div class="input-group">
            <label for="baseUrl">Base URL:</label>
            <input type="text" id="baseUrl" placeholder="ijddt.com/volume16/issue" value="ijddt.com/volume16/issue">
            <label for="issueNum">Issue #:</label>
            <input type="number" id="issueNum" value="1" min="1">
        </div>

        <div class="btn-group">
            <button id="runBtn" class="btn-primary">▶ Run Issue</button>
            <button id="nextBtn" class="btn-secondary">⏭ Next Issue</button>
            <button id="autoBtn" class="btn-secondary">▶▶ Auto Run</button>
            <button id="stopBtn" class="btn-danger" style="display: none;">⏹ Stop</button>
            <button id="clearBtn" class="btn-secondary">🗑 Clear All</button>
        </div>

        <div class="status-bar" id="status">Idle</div>
    </header>

    <main>
        <section class="panel">
            <div class="panel-header">
                <h2>PDF Links</h2>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <span id="pdfCount" class="count-badge">0 PDF links found</span>
                    <button id="copyAllPdfs" class="copy-btn">Copy All</button>
                </div>
            </div>
            <div class="panel-content" id="pdfList">
                <!-- Rows added here -->
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Harvested Emails</h2>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <span id="emailCount" class="count-badge">0 emails found</span>
                    <button id="copyAllEmails" class="copy-btn">Copy All</button>
                </div>
            </div>
            <div class="panel-content" id="emailList">
                <!-- Rows added here -->
            </div>
        </section>
    </main>

    <script>
        // State
        let isAutoRunning = false;
        let pdfLinks = []; // { url, issue, text }
        let harvestedEmails = new Map(); // email -> [pdfUrls]
        let stopRequested = false;

        // Elements
        const baseUrlEl = document.getElementById('baseUrl');
        const issueNumEl = document.getElementById('issueNum');
        const runBtn = document.getElementById('runBtn');
        const nextBtn = document.getElementById('nextBtn');
        const autoBtn = document.getElementById('autoBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusEl = document.getElementById('status');
        const pdfListEl = document.getElementById('pdfList');
        const emailListEl = document.getElementById('emailList');
        const pdfCountEl = document.getElementById('pdfCount');
        const emailCountEl = document.getElementById('emailCount');

        // Helpers
        function setStatus(text, active = false) {
            statusEl.textContent = text;
            if (active) statusEl.classList.add('running');
            else statusEl.classList.remove('running');
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
        }

        function updateUI() {
            // Update PDF list
            pdfListEl.innerHTML = '';
            pdfLinks.forEach(link => {
                const row = document.createElement('div');
                row.className = 'row';
                row.innerHTML = `
                    <div class="row-info">
                        <span class="row-text">${link.url}</span>
                        <span class="row-sub">Issue: ${link.issue} | ${link.text}</span>
                    </div>
                    <button class="copy-btn">Copy</button>
                `;
                row.querySelector('button').onclick = () => copyToClipboard(link.url);
                pdfListEl.appendChild(row);
            });
            pdfCountEl.textContent = `${pdfLinks.length} PDF links found`;

            // Update Email list
            emailListEl.innerHTML = '';
            const sortedEmails = Array.from(harvestedEmails.keys()).sort();
            sortedEmails.forEach(email => {
                const sources = harvestedEmails.get(email);
                const row = document.createElement('div');
                row.className = 'row';
                row.style.flexDirection = 'column';
                row.style.alignItems = 'flex-start';
                row.innerHTML = `
                    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                        <span class="row-text" style="font-weight: 600; color: var(--success);">${email}</span>
                        <button class="copy-btn">Copy</button>
                    </div>
                    <details style="width: 100%; margin-top: 0.3rem;">
                        <summary>Found in ${sources.length} PDFs</summary>
                        <div class="email-breakdown">
                            ${sources.map(s => `<div class="breakdown-item">${s}</div>`).join('')}
                        </div>
                    </details>
                `;
                row.querySelector('button').onclick = () => copyToClipboard(email);
                emailListEl.appendChild(row);
            });
            emailCountEl.textContent = `${sortedEmails.length} emails found`;
        }

        async function runPipeline(issue) {
            const base = baseUrlEl.value.trim();
            const fullUrl = base.startsWith('http') ? base + issue : 'https://' + base + issue;
            
            setStatus(`Fetching links for issue ${issue}...`, true);
            
            try {
                const linkResp = await fetch('/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: fullUrl })
                });
                
                const linkData = await linkResp.json();
                if (!linkResp.ok) throw new Error(linkData.error || 'Failed to fetch links');
                
                const pdfsFound = linkData.links.filter(l => l.url.toLowerCase().endsWith('.pdf'));
                
                if (pdfsFound.length === 0) {
                    return 0; // Signal completion
                }

                // Add new PDF links (prevent duplicates if possible, but specified to accumulate)
                pdfsFound.forEach(l => {
                    if (!pdfLinks.some(existing => existing.url === l.url)) {
                        pdfLinks.push({ url: l.url, issue, text: l.text });
                    }
                });

                updateUI();

                setStatus(`Extracting emails from ${pdfsFound.length} PDFs...`, true);
                
                const emailResp = await fetch('/extract-emails-batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls: pdfsFound.map(l => l.url) })
                });
                
                const emailData = await emailResp.json();
                if (!emailResp.ok) throw new Error(emailData.error || 'Failed to extract emails');

                // Merge emails
                emailData.results.forEach(res => {
                    if (res.success && res.emails) {
                        res.emails.forEach(email => {
                            if (!harvestedEmails.has(email)) {
                                harvestedEmails.set(email, []);
                            }
                            if (!harvestedEmails.get(email).includes(res.url)) {
                                harvestedEmails.get(email).push(res.url);
                            }
                        });
                    }
                });

                updateUI();
                setStatus(`Done — issue ${issue}`);
                return pdfsFound.length;

            } catch (err) {
                console.error(err);
                setStatus(`Error on issue ${issue}: ${err.message}`);
                return -1; // Error
            }
        }

        // Event Listeners
        runBtn.onclick = async () => {
            runBtn.disabled = true;
            nextBtn.disabled = true;
            autoBtn.disabled = true;
            const issue = issueNumEl.value;
            await runPipeline(issue);
            runBtn.disabled = false;
            nextBtn.disabled = false;
            autoBtn.disabled = false;
        };

        nextBtn.onclick = async () => {
            issueNumEl.value = parseInt(issueNumEl.value) + 1;
            runBtn.onclick();
        };

        autoBtn.onclick = async () => {
            isAutoRunning = true;
            stopRequested = false;
            autoBtn.style.display = 'none';
            stopBtn.style.display = 'flex';
            runBtn.disabled = true;
            nextBtn.disabled = true;

            while (isAutoRunning && !stopRequested) {
                const issue = issueNumEl.value;
                const count = await runPipeline(issue);
                
                if (count <= 0 || stopRequested) {
                    if (count === 0) {
                        setStatus(`✅ Completed — no more issues found at issue ${issue}`);
                    }
                    break;
                }
                
                issueNumEl.value = parseInt(issueNumEl.value) + 1;
                setStatus(`Waiting for next run...`);
                await new Promise(r => setTimeout(r, 2000));
            }

            isAutoRunning = false;
            autoBtn.style.display = 'flex';
            stopBtn.style.display = 'none';
            runBtn.disabled = false;
            nextBtn.disabled = false;
        };

        stopBtn.onclick = () => {
            stopRequested = true;
            setStatus(`Stopping...`);
        };

        clearBtn.onclick = () => {
            pdfLinks = [];
            harvestedEmails.clear();
            updateUI();
            setStatus('Idle');
        };

        document.getElementById('copyAllPdfs').onclick = () => {
            copyToClipboard(pdfLinks.map(l => l.url).join('\n'));
        };

        document.getElementById('copyAllEmails').onclick = () => {
            const sortedEmails = Array.from(harvestedEmails.keys()).sort();
            copyToClipboard(sortedEmails.join('\n'));
        };
    </script>
</body>
</html>
